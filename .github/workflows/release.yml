name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version tag
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "if(process.env.TAG !== 'v'+require('./package.json').version) process.exit(1)"
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/*.xpi
            dist/SHA256SUMS
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Create draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.xpi dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --generate-notes
